name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Audit dependencies for known vulnerabilities
        run: pip-audit

      - name: Run tests
        run: python -m pytest -v

      # Both eval scripts seed their own temporary database; nothing in data/ is needed.
      - name: Check eval expectations against the analytics service
        run: python -m evals.check_expectations

      - name: Run the dev evals (must all pass)
        run: python -m evals.run_evals --split dev --fail-under 1.0
